# Still — Linux CI / real build validation gate.
#
# Purpose: build the actual Still desktop application (React + Vite + Tauri 2)
# on REAL hosted Linux runners for both x64 and ARM64, produce the real Linux
# packages, and PROVE each executable is ELF64 for the requested architecture
# by inspecting its ELF header (not by trusting the Rust target name).
#
# Runners:
#   x64   -> ubuntu-22.04     (real hosted x64)
#   arm64 -> ubuntu-22.04-arm (real hosted ARM64, public repositories)
#
# Ubuntu 22.04 is deliberate: it is the oldest supported GitHub-hosted image
# that carries WebKitGTK 4.1, and it keeps the produced glibc floor lower than
# building on 24.04. Do NOT replace the ARM64 job with QEMU or a cross-compile:
# that would not validate the real platform.
#
# Build success here proves compile+package for Linux only. It does NOT prove
# GUI/WebView/SSH/keyring runtime behaviour — those remain UNVERIFIED here.

name: still-linux

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture to build
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false

# Tauri runs linuxdeploy/appimagetool (themselves AppImages) while bundling.
# Extraction avoids depending on FUSE being available inside the runner.
env:
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  prepare:
    name: resolve Linux build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Build matrix
        id: matrix
        env:
          REQUESTED_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          case "$REQUESTED_ARCH" in
            all)
              include='[{"arch":"x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","machine":"X86-64","deb_arch":"amd64"},{"arch":"arm64","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","machine":"AArch64","deb_arch":"arm64"}]'
              ;;
            x64)
              include='[{"arch":"x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","machine":"X86-64","deb_arch":"amd64"}]'
              ;;
            arm64)
              include='[{"arch":"arm64","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","machine":"AArch64","deb_arch":"arm64"}]'
              ;;
            *)
              echo "Unknown architecture: $REQUESTED_ARCH" >&2
              exit 1
              ;;
          esac
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build + verify (Linux ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.include) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build metadata (pre)
        run: |
          echo "commit=$GITHUB_SHA"
          echo "ref=$GITHUB_REF"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release || true
          ldd --version | head -n1 || true
          node --version || true
          npm --version || true
          rustc --version || true
          cargo --version || true
          rustup target list --installed || true
          tauri_lock="$(awk '/^name = "tauri"$/{getline; print; exit}' src-tauri/Cargo.lock)"
          echo "tauri_crate_lock=$tauri_lock"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            wget

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (stable + Linux target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies (locked)
        run: npm ci

      - name: Toolchain versions (post-install)
        run: |
          node -p "console.log('tauri_cli_npm=' + require('./node_modules/@tauri-apps/cli/package.json').version)"
          npx tauri --version
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Rust check (locked)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      # Unit tests = full gate (fail the workflow on failure).
      # Live integration suites (headless_ssh, headless_ssh_hostkey,
      # hostkey_m5) require a provisioned localhost sshd + tmux + test key.
      # They are opt-in here, matching the Windows gates.
      - name: Rust unit tests (locked, full gate)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --bins

      - name: Rust integration tests (locked, sshd+tmux fixture required)
        run: |
          if [[ -n "${STILL_RUN_LIVE_SSH:-}" ]]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml \
              --test headless_ssh --test headless_ssh_hostkey --test hostkey_m5
          else
            echo 'SKIP: live SSH/tmux fixture not provisioned on this runner (STILL_RUN_LIVE_SSH unset). Unit tests above remain the full gate.'
          fi

      - name: Build Tauri app (Linux ${{ matrix.arch }})
        run: npx tauri build --target ${{ matrix.target }}

      - name: Verify ELF architecture + collect metadata
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          bin="src-tauri/target/${TARGET}/release/still-app"
          if [[ ! -x "$bin" ]]; then
            bin="$(find "src-tauri/target/${TARGET}/release" -maxdepth 1 -type f -perm -111 ! -name '*.so' ! -name '*.d' 2>/dev/null | head -n1 || true)"
          fi
          if [[ -z "${bin:-}" || ! -x "$bin" ]]; then
            echo "ERROR: no executable release binary found under src-tauri/target/${TARGET}/release" >&2
            find "src-tauri/target/${TARGET}/release" -maxdepth 2 -type f 2>/dev/null | head -50 >&2 || true
            exit 1
          fi

          echo "binary=$bin"
          echo "binary_size_bytes=$(stat -c '%s' "$bin")"
          file "$bin"
          readelf -h "$bin"

          class="$(readelf -h "$bin" | sed -n 's/^[[:space:]]*Class:[[:space:]]*//p' | head -n1)"
          machine="$(readelf -h "$bin" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p' | head -n1)"
          echo "elf_class=$class"
          echo "elf_machine=$machine"

          if [[ "$class" != "ELF64" ]]; then
            echo "ARCH MISMATCH: expected ELF64, got ${class}" >&2
            exit 1
          fi
          # readelf labels EM_X86_64 as "Advanced Micro Devices X86-64", so
          # accept the documented machine substring rather than requiring an
          # exact string.
          if [[ "$machine" != *"$EXPECTED_MACHINE"* ]]; then
            echo "ARCH MISMATCH: expected ${EXPECTED_MACHINE}, got ${machine}" >&2
            exit 1
          fi
          echo "ELF ARCHITECTURE VERIFIED: ELF64 / ${EXPECTED_MACHINE}"

          bundle="src-tauri/target/${TARGET}/release/bundle"
          debs=()
          rpms=()
          appimages=()
          while IFS= read -r f; do debs+=("$f"); done < <(find "$bundle" -type f -name '*.deb' 2>/dev/null | sort)
          while IFS= read -r f; do rpms+=("$f"); done < <(find "$bundle" -type f -name '*.rpm' 2>/dev/null | sort)
          while IFS= read -r f; do appimages+=("$f"); done < <(find "$bundle" -type f -name '*.AppImage' 2>/dev/null | sort)

          if (( ${#debs[@]} == 0 )); then
            echo 'ERROR: no .deb package was produced' >&2
            exit 1
          fi
          if (( ${#appimages[@]} == 0 )); then
            echo 'ERROR: no .AppImage was produced' >&2
            exit 1
          fi

          deb_arch="$(dpkg-deb -f "${debs[0]}" Architecture)"
          echo "deb_arch=$deb_arch"
          if [[ "$deb_arch" != "$EXPECTED_DEB_ARCH" ]]; then
            echo "ARCH MISMATCH: expected .deb architecture ${EXPECTED_DEB_ARCH}, got ${deb_arch}" >&2
            exit 1
          fi
          echo "PACKAGE ARCHITECTURE VERIFIED: .deb / ${EXPECTED_DEB_ARCH}"

          for f in "${debs[@]}"; do echo "deb=$f size=$(stat -c '%s' "$f")"; done
          for f in "${rpms[@]}"; do echo "rpm=$f size=$(stat -c '%s' "$f")"; done
          for f in "${appimages[@]}"; do echo "appimage=$f size=$(stat -c '%s' "$f")"; file "$f"; done

          manifest="still-linux-${ARCH}-manifest.txt"
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "target=${TARGET}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "node=$(node --version)"
            echo "binary=$bin"
            echo "binary_size_bytes=$(stat -c '%s' "$bin")"
            echo "binary_sha256=$(sha256sum "$bin" | awk '{print $1}')"
            echo "elf_class=$class"
            echo "elf_machine=$machine"
            echo "deb_arch=$deb_arch"
            for f in "${debs[@]}"; do
              echo "deb=$f size=$(stat -c '%s' "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
            done
            for f in "${rpms[@]}"; do
              echo "rpm=$f size=$(stat -c '%s' "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
            done
            for f in "${appimages[@]}"; do
              echo "appimage=$f size=$(stat -c '%s' "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
            done
          } > "$manifest"
          cat "$manifest"

      - name: Upload Linux ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: still-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/still-app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            still-linux-${{ matrix.arch }}-manifest.txt

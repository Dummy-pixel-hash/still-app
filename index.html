<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <script>
      // Establish transparency before the module graph/CSS loads in the tiny webview.
      if (new URLSearchParams(location.search).get("orb") === "1") document.documentElement.classList.add("still-orb-window");
    </script>
    <style>
      html.still-orb-window, html.still-orb-window body, html.still-orb-window #root { background: transparent; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Still</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

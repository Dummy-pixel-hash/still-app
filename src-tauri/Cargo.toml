[package]
name = "still-app"
version = "0.1.1"
description = "Still — persistent remote terminal (production bootstrap)"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tauri-plugin-clipboard-manager = "2"
keyring = "4.2.0"
russh = "0.63.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.1", features = ["full"] }

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
